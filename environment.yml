name: eeg-bci
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - libblas=*=*openblas  # MKL crashes on Windows when the env is not activated (e.g. Jupyter kernels)
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyter
  - ipykernel
  - tqdm
  - pip
  - pip:
      - mne==1.13.2
      - --extra-index-url https://download.pytorch.org/whl/cu130   # cu130: needed for RTX 50-series (sm_120); was cu126 on the RTX 4060
      - torch==2.14.1
      - braindecode==1.8.1     # reference EEGNet (correctness check) + exponential moving standardization
      - PyWavelets==1.8.0      # wavelet energy features (mentor's pipeline)
